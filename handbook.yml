# Handbook settings: the few things that are not in an issue.
# Edit on GitHub with the pencil icon. The website picks changes up on its next update.

# Name shown at the top left of the website
name: Requisio handbook

# The short brief at the top of "All features → Overview"
brief: >-
  Requisio helps employees ask to buy things, lets approvers approve or reject them,
  and lets admins set up the rules. Made-up content, used to practise UX documentation.

# Stages, in product order. They group the left menu and the whole-product flowchart.
# Each feature picks one in its "Stage" box. If you add or rename a stage here,
# also add it to the Stage list in .github/ISSUE_TEMPLATE/1-feature.yml.
stages:
  - Set up
  - Request
  - Approve
  - Track

# The project board that holds status, priority, dates and comments/inputs
board: 9
