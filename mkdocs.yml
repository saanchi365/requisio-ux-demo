site_name: Requisio handbook
site_url: https://saanchi365.github.io/requisio-ux-demo/
repo_url: https://github.com/saanchi365/requisio-ux-demo

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Features:
      - features/index.md
      - Setting up:
          - Set up approval rules: features/setup-rules.md
      - Requesting:
          - Create a purchase request: features/create-request.md
          - Track purchase requests: features/track-requests.md
      - Approving:
          - Approve purchase requests: features/approvals.md
  - Users:
      - User understanding: user-understanding.md
      - Journey map: journey-map.md
      - Use cases: use-cases.md
  - Requirements: requirements.md
