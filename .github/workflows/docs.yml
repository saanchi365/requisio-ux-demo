name: Build handbook

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    - cron: "17 * * * *" # every hour, to catch changes made only on the board
  workflow_dispatch: # the "Run workflow" button

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for flowchart created/updated dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
      # Step 1: the page maker reads the issues, board, flowcharts and wireframes and writes the pages
      - run: python scripts/build_handbook.py
        env:
          GH_TOKEN: ${{ secrets.HANDBOOK_TOKEN || github.token }}
          PROJECT_NUMBER: "9"
      # Step 2: MkDocs turns the pages into the website
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
