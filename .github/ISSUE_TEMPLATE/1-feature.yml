name: "1 · Feature"
description: Top level only. Never pick this inside another issue. A big thing the product does; it becomes its own page in the handbook.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        A **feature** is the top level, e.g. "Create a purchase request".
        After creating it, add its requirements with **Create sub-issue** at the bottom, and pick **2 · Requirement**.
        Its flowchart goes in the `flowcharts` folder and its screens in the `wireframes` folder (see HOW-TO.md).
  - type: textarea
    attributes:
      label: What it is
      description: One or two sentences. This is the brief at the top of the feature's Overview.
    validations:
      required: true
  - type: input
    attributes:
      label: Who uses it
      placeholder: e.g. Requester (any employee)
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Stage
      description: Where this feature sits in the product. It groups the left menu and the product flowchart. (The list is set in handbook.yml.)
      options: [Set up, Request, Approve, Track]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use cases
      description: One per line, starting with "- ". They show under the feature's description, in a section people can open and close.
      value: |
        -
    validations:
      required: true
  - type: textarea
    attributes:
      label: Open questions
      description: Optional. Questions about the whole feature that still need an answer, one per line starting with "- ".
  - type: input
    attributes:
      label: Given by
      description: Who asked for it
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where it came from
      options: [Meeting, Email, Chat, Document, Other]
