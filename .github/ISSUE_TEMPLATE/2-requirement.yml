name: "2 · Requirement"
description: Pick this inside a 1 · Feature. One thing the feature must do.
labels: ["requirement"]
body:
  - type: markdown
    attributes:
      value: |
        A **requirement** sits inside a **1 · Feature**. If it's big, split it with **Create sub-issue** and pick **3 · Sub-requirement**.
        Small points (e.g. "opens in Word", "clause library on the side") go in **Details** as bullets, not as more issues.
  - type: textarea
    attributes:
      label: Requirement
      description: What is needed, in plain words
    validations:
      required: true
  - type: input
    attributes:
      label: Given by
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where it came from
      options: [Meeting, Email, Chat, Document, Other]
  - type: textarea
    attributes:
      label: Done when
      description: One per line, starting with "- "
      value: |
        - 
  - type: textarea
    attributes:
      label: Details
      description: The small points, one per line, starting with "- "
      value: |
        - 
  - type: textarea
    attributes:
      label: Open questions
      description: Optional. Questions about this requirement that still need an answer, one per line starting with "- ". They show under the Requirements table.
  - type: dropdown
    attributes:
      label: How sure are we?
      options: [Confirmed — the person said it clearly, Not sure yet — needs checking]
